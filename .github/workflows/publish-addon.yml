name: Publish Home Assistant app

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-addon.yml"
      - "eufy_sdk_bridge_talkback/**"
      - "src/**"
      - "scripts/**"
      - "*.mjs"
      - "package*.json"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Validate source
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm test
      - name: Resolve app version
        run: |
          VERSION=$(node --input-type=module -e 'import fs from "node:fs"; const s=fs.readFileSync("eufy_sdk_bridge_talkback/config.yaml","utf8"); console.log(s.match(/^version: "([^"]+)"/m)[1])')
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_IMAGE=ghcr.io/jjcazau/eufy-sdk-bridge-talkback-${{ matrix.arch }}" >> "$GITHUB_ENV"
      - name: Build pinned app
        run: |
          docker build --platform '${{ matrix.platform }}' \
            --build-arg BUILD_ARCH='${{ matrix.arch }}' \
            --build-arg BRIDGE_REF='${{ github.sha }}' \
            --tag "$APP_IMAGE:$APP_VERSION" eufy_sdk_bridge_talkback
      - name: Verify proxied WebSocket signaling
        run: docker run --rm "$APP_IMAGE:$APP_VERSION" node scripts/check-go2rtc-origin.mjs
      - name: Publish app image
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          docker push "$APP_IMAGE:$APP_VERSION"
